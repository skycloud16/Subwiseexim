<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B800" />
      <stop offset="100%" stop-color="#D9A200" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A" />
      <stop offset="100%" stop-color="#162B4D" />
    </linearGradient>
  </defs>
  
  <!-- Emblem Group -->
  <g transform="translate(4, 4)">
    <!-- Base Shield / Hexagon -->
    <polygon points="28,2 50,14 50,42 28,54 6,42 6,14" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Outer Export Globe Orbit Ring -->
    <ellipse cx="28" cy="28" rx="22" ry="9" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="6,2" transform="rotate(-25 28 28)"/>
    
    <!-- Inner Motor Rotor Blades / W & E geometry -->
    <path d="M 16,18 L 22,36 L 28,22 L 34,36 L 40,18" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="28" r="3.5" fill="#F5B800"/>
  </g>

  <!-- Typography -->
  <!-- Main Brand Name -->
  <text x="68" y="35" font-family="'Inter', 'Manrope', 'Helvetica Neue', sans-serif" font-weight="800" font-size="24" fill="#0B1F3A" letter-spacing="1">WISE <tspan fill="#F5B800">EXIM</tspan></text>
  
  <!-- Subtitle Tagline -->
  <text x="68.5" y="49" font-family="'Inter', 'Manrope', 'Helvetica Neue', sans-serif" font-weight="600" font-size="7.5" fill="#4B5563" letter-spacing="1.2">MANUFACTURING • WHOLESALE • EXPORT</text>
</svg>
